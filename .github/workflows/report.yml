name: morning-report

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 Paris (hiver)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m agent.report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
