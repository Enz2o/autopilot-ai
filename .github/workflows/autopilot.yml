name: autopilot

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours, 24/7
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pipeline + auto-guérison
        shell: bash
        run: |
          export SITE_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          set -o pipefail
          if python -m agent.main 2>&1 | tee run.log; then exit 0; fi
          python -m agent.heal run.log || true
          sleep 60
          if python -m agent.main 2>&1 | tee run2.log; then
            python -m agent.notify "✅ Relance réussie après incident" ; exit 0
          fi
          python -m agent.notify "❌ Échec après auto-réparation, prochain essai dans 4 h" run2.log
          exit 1

      - name: Sauvegarde (articles, images, logs, patchs)
        if: always()
        shell: bash
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add docs state agent
          git diff --cached --quiet && exit 0
          git commit -m "autopilot: $(date -u +%FT%H:%MZ)"
          git pull --rebase && git push
